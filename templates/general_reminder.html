<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>General Reminder</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background-color: #f8fafc; margin: 0; padding: 20px; color: #1e293b; }
        .container { max-width: 600px; margin: 0 auto; background: #ffffff; border-radius: 8px; border: 1px solid #cbd5e1; overflow: hidden; }
        .header { background: #334155; color: #ffffff; padding: 24px; text-align: center; }
        .content { padding: 24px; }
        .btn-wrapper { text-align: center; margin: 20px 0; }
        .btn { display: inline-block; background-color: #334155; color: #ffffff !important; text-decoration: none; padding: 10px 22px; border-radius: 6px; }
        .footer { background: #f1f5f9; padding: 14px; text-align: center; font-size: 12px; color: #94a3b8; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h2>{{ subject }}</h2>
        </div>
        <div class="content">
            <p>Hello <strong>{{ name }}</strong>,</p>
            <p>This is a notification regarding: <strong>{{ event_name }}</strong> scheduled for {{ due_date }} ({{ scheduled_time }}).</p>
            <div class="btn-wrapper">
                <a href="{{ meeting_link }}" class="btn">View Link</a>
            </div>
        </div>
        <div class="footer">
            <p>Automated Notification System</p>
        </div>
    </div>
</body>
</html>
